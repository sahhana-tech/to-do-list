<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A task manager with CRUD operations, filters, and local storage."><title>Donezo — Task Manager</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app"><header class="app-header"><div><p class="eyebrow">YOUR PERSONAL SPACE</p><h1>Make room for<br><em>what matters.</em></h1></div><div class="date-badge" id="today"></div></header><section class="panel" aria-labelledby="add-heading"><h2 id="add-heading">Add a task</h2><form id="taskForm"><label class="sr-only" for="taskInput">Task description</label><input id="taskInput" maxlength="160" placeholder="What needs to get done?" required><button type="submit">Add task +</button></form><p id="feedback" class="feedback" role="status" aria-live="polite"></p></section><section class="task-section" aria-labelledby="list-heading"><div class="list-heading"><div><p class="eyebrow">YOUR CHECKLIST</p><h2 id="list-heading">Tasks <span id="taskCount">0</span></h2></div><div class="filters" role="group" aria-label="Filter tasks"><button class="filter active" data-filter="all" aria-pressed="true">All</button><button class="filter" data-filter="active" aria-pressed="false">Active</button><button class="filter" data-filter="completed" aria-pressed="false">Completed</button></div></div><ul id="taskList" class="task-list" aria-label="Tasks"></ul><p id="emptyState" class="empty">Nothing here yet. Add your first task above ✨</p><button id="clearCompleted" class="clear-button" type="button">Clear completed tasks</button></section><footer>Small steps still move you forward.</footer></main><script src="script.js"></script></body></html>
